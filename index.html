<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="images/icon - transparent.png">
  <title>Evolving Agentic Workflows · Frontier Creatives · Jun 9, 2026</title>
  <meta name="description" content="Marc Krejci lightning talk for Frontier Creatives at Pioneer Square Labs, Jun 9, 2026.">
  <meta name="author" content="Marc Krejci">
  <meta name="theme-color" content="#FFCC64">

  <!-- Open Graph / social share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pathfinder Foundry">
  <meta property="og:title" content="Evolving Agentic Workflows">
  <meta property="og:description" content="Design thinking, rebuilt for agents. A Frontier Creatives lightning talk by Marc Krejci.">
  <meta property="og:image" content="./og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Evolving Agentic Workflows">
  <meta name="twitter:description" content="Design thinking, rebuilt for agents. A Frontier Creatives lightning talk by Marc Krejci.">
  <meta name="twitter:image" content="./og-image.png">

  <link rel="stylesheet" href="styles.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    // =====================================================
    // BRAND CONSTANTS · Pathfinder Foundry
    // =====================================================
    const ACCENT      = "#FFCC64";
    const ACCENT_DIM  = "rgba(255,204,100,0.18)";
    const ACCENT_SOFT = "rgba(255,204,100,0.08)";
    const TEXT        = "#f5f5f5";
    const TEXT_MUTED  = "#a8a8a8";
    const TEXT_DIM    = "rgba(245,245,245,0.55)";
    const CARD_BG     = "rgba(255,255,255,0.04)";
    const CARD_BORDER = "rgba(255,255,255,0.10)";

    const FONT_STACK =
      "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif";
    const SERIF_ITALIC =
      "'Baskerville', 'Baskerville Old Face', Garamond, Georgia, 'Times New Roman', serif";
    const MONO =
      "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";

    // =====================================================
    // BRAND LOCKUP
    // =====================================================
    function PFLockup({ height = 28 }) {
      const [errored, setErrored] = useState(false);
      if (!errored) {
        return (
          <img
            src="images/logo + wordmark _ white.png"
            alt="Pathfinder Foundry"
            style={{ height, width: "auto", display: "block" }}
            onError={() => setErrored(true)}
          />
        );
      }
      const scale = height / 28;
      const r = 2.2 * scale;
      const cx = [4, 12, 20, 28].map(x => x * scale);
      const cy = [4, 12, 20].map(y => y * scale);
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10 * scale }}>
          <svg width={32 * scale} height={24 * scale}
               viewBox={`0 0 ${32 * scale} ${24 * scale}`}
               aria-label="Pathfinder Foundry">
            {cx.map((x, i) => <circle key={`r1-${i}`} cx={x} cy={cy[0]} r={r} fill={ACCENT} />)}
            {cx.map((x, i) => <circle key={`r2-${i}`} cx={x} cy={cy[1]} r={r} fill={ACCENT} />)}
            <circle cx={cx[0]} cy={cy[2]} r={r} fill={ACCENT} />
            <circle cx={cx[2]} cy={cy[2]} r={r} fill={ACCENT} />
          </svg>
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.05 }}>
            <span style={{ fontSize: 14 * scale, fontWeight: 500, color: TEXT, fontFamily: FONT_STACK }}>pathfinder</span>
            <span style={{ fontSize: 11 * scale, fontStyle: "italic", color: TEXT, fontFamily: SERIF_ITALIC, textAlign: "right" }}>foundry</span>
          </div>
        </div>
      );
    }

    // =====================================================
    // FULLSCREEN BUTTON
    // =====================================================
    function FullscreenButton() {
      const [isFs, setIsFs] = useState(false);
      useEffect(() => {
        const onChange = () => setIsFs(!!document.fullscreenElement);
        document.addEventListener("fullscreenchange", onChange);
        return () => document.removeEventListener("fullscreenchange", onChange);
      }, []);
      const toggle = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };
      return (
        <button className="pf-fs-btn" onClick={toggle}
          aria-label={isFs ? "Exit fullscreen" : "Enter fullscreen"}
          title={isFs ? "Exit fullscreen" : "Enter fullscreen"}>
          {isFs ? (
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M10 2v4h4M2 10h4v4M6 2v4H2M14 6V2M14 10h-4v4" />
            </svg>
          ) : (
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" />
            </svg>
          )}
        </button>
      );
    }

    // =====================================================
    // SHARED SLIDE PRIMITIVES
    // =====================================================
    function SlideShell({ children, dense = false }) {
      return (
        <div style={{
          width: "100%",
          height: "100%",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          padding: dense ? "5vh 6vw" : "9vh 8vw",
          boxSizing: "border-box",
        }}>
          <div style={{ width: "100%", maxWidth: 1280 }}>{children}</div>
        </div>
      );
    }

    function Eyebrow({ children, color = ACCENT }) {
      return (
        <div style={{
          fontSize: "0.78rem",
          letterSpacing: 2.4,
          color,
          fontWeight: 700,
          marginBottom: "1.1rem",
          textTransform: "uppercase",
        }}>
          {children}
        </div>
      );
    }

    function SlideTitle({ children, size = "lg" }) {
      const fs = size === "xl"
        ? "clamp(2.8rem, 5.4vw, 5rem)"
        : "clamp(2.2rem, 4.2vw, 4rem)";
      return (
        <h1 style={{
          fontSize: fs,
          lineHeight: 1.06,
          letterSpacing: "-0.022em",
          color: TEXT,
          margin: "0 0 1.8rem 0",
          fontWeight: 700,
        }}>
          {children}
        </h1>
      );
    }

    function Card({ children, accentTop = false, accentLeft = false, style = {} }) {
      return (
        <div style={{
          padding: "1.25rem 1.4rem",
          background: CARD_BG,
          border: `1px solid ${CARD_BORDER}`,
          borderTop: accentTop ? `3px solid ${ACCENT}` : undefined,
          borderLeft: accentLeft ? `3px solid ${ACCENT}` : undefined,
          borderRadius: 14,
          ...style,
        }}>
          {children}
        </div>
      );
    }

    // Arrow SVG used between cards in horizontal flows
    function FlowArrow() {
      return (
        <div style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          flexShrink: 0,
          width: 32,
          paddingBottom: "0.8rem",
        }}>
          <svg width="24" height="14" viewBox="0 0 24 14">
            <line x1="0" y1="7" x2="18" y2="7"
                  stroke={ACCENT} strokeWidth="1.5" strokeOpacity="0.5" />
            <polyline points="14,3 20,7 14,11" fill="none"
                      stroke={ACCENT} strokeWidth="1.5" strokeOpacity="0.5"
                      strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>
      );
    }

    // QR code placeholder with a recognizable grid pattern
    function QRPlaceholder({ url, label, size = 150 }) {
      return (
        <div style={{
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          gap: "0.7rem",
        }}>
          <div style={{
            width: size,
            height: size,
            border: `2px dashed ${ACCENT}`,
            borderRadius: 12,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 8,
            background: ACCENT_SOFT,
            flexShrink: 0,
          }}>
            {/* Stylized QR grid */}
            <svg width={size * 0.54} height={size * 0.54} viewBox="0 0 46 46" aria-hidden="true">
              {/* Top-left finder */}
              <rect x="2"  y="2"  width="14" height="14" rx="2" fill="none" stroke={ACCENT} strokeWidth="1.8" opacity="0.7"/>
              <rect x="5.5" y="5.5" width="7" height="7" fill={ACCENT} opacity="0.8"/>
              {/* Top-right finder */}
              <rect x="30" y="2"  width="14" height="14" rx="2" fill="none" stroke={ACCENT} strokeWidth="1.8" opacity="0.7"/>
              <rect x="33.5" y="5.5" width="7" height="7" fill={ACCENT} opacity="0.8"/>
              {/* Bottom-left finder */}
              <rect x="2"  y="30" width="14" height="14" rx="2" fill="none" stroke={ACCENT} strokeWidth="1.8" opacity="0.7"/>
              <rect x="5.5" y="33.5" width="7" height="7" fill={ACCENT} opacity="0.8"/>
              {/* Data dots */}
              <rect x="20" y="3"  width="5" height="5" fill={ACCENT} opacity="0.5"/>
              <rect x="20" y="11" width="5" height="5" fill={ACCENT} opacity="0.35"/>
              <rect x="3"  y="20" width="5" height="5" fill={ACCENT} opacity="0.5"/>
              <rect x="11" y="20" width="5" height="5" fill={ACCENT} opacity="0.35"/>
              <rect x="30" y="20" width="5" height="5" fill={ACCENT} opacity="0.5"/>
              <rect x="38" y="20" width="5" height="5" fill={ACCENT} opacity="0.35"/>
              <rect x="20" y="30" width="5" height="5" fill={ACCENT} opacity="0.5"/>
              <rect x="20" y="38" width="5" height="5" fill={ACCENT} opacity="0.35"/>
              <rect x="30" y="30" width="5" height="5" fill={ACCENT} opacity="0.55"/>
              <rect x="38" y="38" width="5" height="5" fill={ACCENT} opacity="0.55"/>
              <rect x="30" y="38" width="5" height="5" fill={ACCENT} opacity="0.35"/>
              <rect x="38" y="30" width="5" height="5" fill={ACCENT} opacity="0.35"/>
            </svg>
            <div style={{
              fontSize: "0.58rem",
              letterSpacing: 1.8,
              color: ACCENT,
              fontWeight: 700,
              textTransform: "uppercase",
              opacity: 0.8,
            }}>
              [ QR CODE ]
            </div>
          </div>
          {label && (
            <div style={{
              fontSize: "0.82rem",
              color: TEXT,
              fontWeight: 600,
              textAlign: "center",
              lineHeight: 1.3,
            }}>{label}</div>
          )}
          {url && (
            <div style={{
              fontSize: "0.72rem",
              color: TEXT_MUTED,
              textAlign: "center",
              letterSpacing: 0.3,
              fontFamily: MONO,
            }}>{url}</div>
          )}
        </div>
      );
    }

    // =====================================================
    // BROWSER CHROME · Preview card + fullscreen overlay
    // =====================================================
    const BrowserOverlayContext = React.createContext({ open: () => {} });

    function TrafficDots() {
      return (
        <div style={{ display: "flex", gap: 5, flexShrink: 0 }}>
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: "#ff5f57" }} />
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: "#febc2e" }} />
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: "#28c840" }} />
        </div>
      );
    }

    const BrowserRefreshIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
    );
    const BrowserShareIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
    );
    const BrowserExpandIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="15 3 21 3 21 9" />
        <polyline points="9 21 3 21 3 15" />
        <line x1="21" y1="3" x2="14" y2="10" />
        <line x1="3" y1="21" x2="10" y2="14" />
      </svg>
    );
    const BrowserCloseIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    function BrowserChromeButton({ onClick, title, children }) {
      const [hover, setHover] = useState(false);
      return (
        <button
          onClick={onClick}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          title={title}
          aria-label={title}
          style={{
            width: 26, height: 26,
            border: "none",
            background: hover ? "rgba(255,255,255,0.10)" : "transparent",
            cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
            borderRadius: 5,
            color: hover ? TEXT : TEXT_MUTED,
            transition: "background 120ms, color 120ms",
            padding: 0,
            fontFamily: FONT_STACK,
          }}
        >
          {children}
        </button>
      );
    }

    function BrowserPreviewCard({ url, label, tagline, image, height = 220, fill = false, showHeader = true }) {
      const iframeRef = useRef(null);
      const overlayCtx = React.useContext(BrowserOverlayContext);
      const [imgError, setImgError] = useState(false);
      const display = url.replace(/^https?:\/\//, "");

      const refresh = (e) => {
        e.stopPropagation();
        const iframe = iframeRef.current;
        if (iframe) { const src = iframe.src; iframe.src = ""; iframe.src = src; }
      };
      const openTab = (e) => { e.stopPropagation(); window.open(url, "_blank", "noopener"); };
      const expand  = (e) => { e.stopPropagation(); overlayCtx.open(url, label, image); };

      return (
        <div
          onClick={expand}
          style={{
            display: "flex", flexDirection: "column",
            background: CARD_BG,
            border: `1px solid ${CARD_BORDER}`,
            borderRadius: 12, overflow: "hidden",
            cursor: "zoom-in",
            transition: "border-color 150ms",
            height: fill ? "100%" : undefined,
            minHeight: 0,
            boxShadow: fill ? "0 8px 36px rgba(0,0,0,0.35)" : undefined,
          }}
          onMouseEnter={(e) => { e.currentTarget.style.borderColor = ACCENT_DIM; }}
          onMouseLeave={(e) => { e.currentTarget.style.borderColor = CARD_BORDER; }}
        >
          {showHeader && (label || tagline) && (
            <div style={{ padding: "0.7rem 0.9rem 0.55rem", borderBottom: `1px solid ${CARD_BORDER}` }}>
              {label && (
                <div style={{
                  fontSize: "0.78rem", letterSpacing: 1.6, color: ACCENT,
                  fontWeight: 700, textTransform: "uppercase", marginBottom: 2,
                }}>{label}</div>
              )}
              {tagline && (
                <div style={{
                  fontSize: "0.78rem", color: TEXT_MUTED, lineHeight: 1.4,
                  fontStyle: "italic", fontFamily: SERIF_ITALIC,
                }}>{tagline}</div>
              )}
            </div>
          )}
          {/* Chrome bar */}
          <div style={{
            display: "flex", alignItems: "center", gap: 8,
            padding: "6px 9px",
            background: "rgba(255,255,255,0.04)",
            borderBottom: `1px solid ${CARD_BORDER}`,
            flexShrink: 0,
          }}>
            <TrafficDots />
            <div style={{
              flex: 1, background: "rgba(255,255,255,0.08)", borderRadius: 5,
              padding: "3px 8px", fontFamily: MONO, fontSize: 11, color: TEXT_MUTED,
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0,
            }}>
              {display}
            </div>
            <div style={{ display: "flex", gap: 2 }}>
              {!image && (
                <BrowserChromeButton onClick={refresh} title="Refresh"><BrowserRefreshIcon /></BrowserChromeButton>
              )}
              <BrowserChromeButton onClick={openTab} title="Open in new tab"><BrowserShareIcon /></BrowserChromeButton>
              <BrowserChromeButton onClick={expand} title="Fullscreen"><BrowserExpandIcon /></BrowserChromeButton>
            </div>
          </div>
          {/* Body, screenshot (for sites that block iframing) or live iframe */}
          <div style={{
            position: "relative",
            height: fill ? undefined : height,
            flex: fill ? "1 1 auto" : undefined,
            minHeight: 0,
            overflow: "hidden",
            background: image && !imgError ? "#0c0c0c" : "#fff",
          }}>
            {image ? (
              imgError ? (
                <div style={{
                  position: "absolute", inset: 0,
                  display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center",
                  gap: 12, padding: "0 2rem", textAlign: "center",
                  background: "#0c0c0c", color: TEXT_MUTED, fontFamily: MONO, fontSize: 13,
                }}>
                  <div style={{ color: TEXT }}>Screenshot not found</div>
                  <div>Add <span style={{ color: ACCENT }}>{image}</span> to display it here.</div>
                  <button
                    onClick={openTab}
                    style={{
                      marginTop: 4, padding: "9px 18px", cursor: "pointer",
                      background: ACCENT, color: "#111", border: "none", borderRadius: 6,
                      fontFamily: MONO, fontWeight: 700, fontSize: 12,
                    }}
                  >Open live project ↗</button>
                </div>
              ) : (
                <img
                  src={image}
                  alt={label || url}
                  onClick={expand}
                  onError={() => setImgError(true)}
                  title={`Open ${display}`}
                  style={{
                    width: "100%", height: "auto", display: "block",
                    cursor: "zoom-in", background: "#fff",
                  }}
                />
              )
            ) : (
              <React.Fragment>
                <iframe
                  ref={iframeRef}
                  src={url}
                  title={label || url}
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                  loading="lazy"
                  style={{
                    position: "absolute", inset: 0,
                    width: "100%", height: "100%",
                    border: "none", display: "block", background: "#fff",
                  }}
                />
                {/* Scrim so card click reliably triggers expand even over iframe */}
                <div
                  onClick={expand}
                  style={{ position: "absolute", inset: 0, background: "transparent", cursor: "zoom-in" }}
                  aria-hidden="true"
                />
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function BrowserOverlay({ state, onClose }) {
      const iframeRef = useRef(null);
      const { url, label, image, visible } = state;
      const [imgError, setImgError] = useState(false);

      useEffect(() => { setImgError(false); }, [image]);

      useEffect(() => {
        if (!visible) return;
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [visible, onClose]);

      const refresh = () => {
        const iframe = iframeRef.current;
        if (iframe) { const src = iframe.src; iframe.src = ""; iframe.src = src; }
      };
      const openTab = () => { if (url) window.open(url, "_blank", "noopener"); };

      if (!visible || !url) return null;
      const display = url.replace(/^https?:\/\//, "");

      return (
        <div
          onClick={onClose}
          style={{
            position: "fixed", inset: 0, zIndex: 500,
            display: "flex", alignItems: "center", justifyContent: "center",
            background: "rgba(0,0,0,0.82)",
            padding: "4.5vh 5vw",
            animation: "pf-overlayIn 220ms ease-out",
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              width: "100%", height: "100%",
              display: "flex", flexDirection: "column",
              background: "#111",
              border: `1px solid ${CARD_BORDER}`,
              borderRadius: 12, overflow: "hidden",
              boxShadow: "0 30px 80px rgba(0,0,0,0.6)",
            }}
          >
            <div style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "9px 14px",
              background: "rgba(255,255,255,0.04)",
              borderBottom: `1px solid ${CARD_BORDER}`,
              flexShrink: 0,
            }}>
              <TrafficDots />
              <div style={{
                flex: 1, background: "rgba(255,255,255,0.08)", borderRadius: 5,
                padding: "5px 12px", fontFamily: MONO, fontSize: 12, color: TEXT_MUTED,
                whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0,
              }}>
                {label ? `${label}   ·   ${display}` : display}
              </div>
              <div style={{ display: "flex", gap: 3 }}>
                {!image && (
                  <BrowserChromeButton onClick={refresh} title="Refresh"><BrowserRefreshIcon /></BrowserChromeButton>
                )}
                <BrowserChromeButton onClick={openTab} title="Open in new tab"><BrowserShareIcon /></BrowserChromeButton>
                <BrowserChromeButton onClick={onClose} title="Close (Esc)"><BrowserCloseIcon /></BrowserChromeButton>
              </div>
            </div>
            {image ? (
              /* Screenshot mode, claude.ai / chatgpt block iframing, so we show a
                 captured image styled like the live page. Click → open the real site. */
              <div style={{ flex: 1, minHeight: 0, position: "relative", overflow: "auto", background: "#fff" }}>
                {imgError ? (
                  <div style={{
                    position: "absolute", inset: 0,
                    display: "flex", flexDirection: "column",
                    alignItems: "center", justifyContent: "center",
                    gap: 10, padding: "0 2rem", textAlign: "center",
                    background: "#0c0c0c", color: TEXT_MUTED, fontFamily: MONO, fontSize: 13,
                  }}>
                    <div style={{ color: TEXT }}>Screenshot not found</div>
                    <div>Add <span style={{ color: ACCENT }}>{image}</span> to display it here.</div>
                    <button
                      onClick={openTab}
                      style={{
                        marginTop: 6, padding: "8px 16px", cursor: "pointer",
                        background: ACCENT, color: "#111", border: "none", borderRadius: 6,
                        fontFamily: MONO, fontWeight: 700, fontSize: 12,
                      }}
                    >Open live site ↗</button>
                  </div>
                ) : (
                  <img
                    src={image}
                    alt={label || url}
                    onClick={openTab}
                    onError={() => setImgError(true)}
                    title={`Open ${display} in a new tab`}
                    style={{ width: "100%", height: "auto", display: "block", cursor: "pointer" }}
                  />
                )}
                {!imgError && (
                  <div style={{

    function ImageOverlay({ src, alt, onClose }) {
      const [closing, setClosing] = useState(false);

      const handleClose = useCallback(() => {
        setClosing(true);
        setTimeout(() => onClose(), 240);
      }, [onClose]);

      useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") handleClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [handleClose]);

      if (!src) return null;

      const EASING_IN  = "cubic-bezier(0.16, 1, 0.3, 1)";   // smooth decelerate, natural pop
      const EASING_OUT = "cubic-bezier(0.4, 0, 1, 1)";       // accelerate into close

      return (
        /* Full-screen scrim, blurred backdrop */
        <div
          onClick={handleClose}
          style={{
            position: "fixed",
            inset: 0,
            zIndex: 400,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: "5vh 7vw",
            cursor: "zoom-out",
            backdropFilter: "blur(22px) saturate(140%)",
            WebkitBackdropFilter: "blur(22px) saturate(140%)",
            background: closing ? "rgba(0,0,0,0)" : "rgba(0,0,0,0.62)",
            animation: closing
              ? `pf-scrimOut 240ms ${EASING_OUT} forwards`
              : `pf-scrimIn  300ms ${EASING_IN}  forwards`,
          }}
        >
          {/* Liquid-glass panel, animates scale + opacity */}
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "relative",
              maxWidth: "78vw",
              maxHeight: "84vh",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              gap: "1.1rem",
              padding: "1.6rem 1.8rem 1.4rem",
              /* Liquid glass core */
              background: "rgba(16, 16, 16, 0.68)",
              backdropFilter: "blur(52px) saturate(180%)",
              WebkitBackdropFilter: "blur(52px) saturate(180%)",
              borderRadius: 20,
              /* Subtle glass border: top highlight + ambient edge */
              border: "1px solid rgba(255,255,255,0.13)",
              boxShadow: [
                "0 0 0 0.5px rgba(0,0,0,0.5)",                      /* outer crisp edge */
                "0 36px 80px rgba(0,0,0,0.65)",                      /* depth shadow */
                "inset 0  1px 0   rgba(255,255,255,0.14)",           /* top specular */
                "inset 0 -1px 0   rgba(0,0,0,0.28)",                 /* bottom inner shadow */
                `inset 0 0 40px rgba(255,204,100,0.03)`,             /* warm accent tint */
              ].join(", "),
              animation: closing
                ? `pf-imgOut 240ms ${EASING_OUT} forwards`
                : `pf-imgIn  320ms ${EASING_IN}  forwards`,
            }}
          >
            {/* Close hint + label row */}
            <div style={{
              display: "flex",
              width: "100%",
              alignItems: "center",
              justifyContent: "space-between",
            }}>
              <div style={{
                fontSize: "0.72rem",
                letterSpacing: 2.2,
                color: ACCENT,
                fontWeight: 700,
                textTransform: "uppercase",
              }}>
                {alt}
              </div>
              <div style={{
                fontSize: "0.6rem",
                letterSpacing: 2,
                color: TEXT_MUTED,
                textTransform: "uppercase",
                fontWeight: 600,
                opacity: 0.65,
              }}>
                Esc to close
              </div>
            </div>

            {/* Image on a solid dark surface, no PNG bleed-through */}
            <div style={{
              background: "#0a0a0a",
              borderRadius: 12,
              overflow: "hidden",
              maxWidth: "100%",
              maxHeight: "72vh",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              border: "1px solid rgba(255,255,255,0.07)",
            }}>

                src={src}
                alt={alt}
                style={{
                  maxWidth: "100%",
                  maxHeight: "72vh",
                  objectFit: "contain",
                  display: "block",
                }}
              />
            </div>
          </div>
        </div>
      );

    // =====================================================
    // MAIN PRESENTATION SHELL
    // =====================================================
    function Presentation() {
      const [current, setCurrent]     = useState(0);
      const [visible, setVisible]     = useState(true);
      const [overlay, setOverlay]     = useState({ visible: false, url: null, label: null, image: null });

      const openOverlay  = useCallback((url, label, image = null) => setOverlay({ visible: true, url, label, image }), []);
      const closeOverlay = useCallback(() => setOverlay({ visible: false, url: null, label: null, image: null }), []);

      const goTo = useCallback((idx) => {
        setCurrent((prev) => {
          const next = Math.max(0, Math.min(SLIDES.length - 1, idx));
          if (next !== prev) {
            setVisible(false);
            setTimeout(() => setVisible(true), 80);
          }
          return next;
        });
      }, []);

      const goNext = useCallback(() => goTo(current + 1), [current, goTo]);
      const goPrev = useCallback(() => goTo(current - 1), [current, goTo]);

      useEffect(() => {
        const handler = (e) => {
          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
          if (e.key === "Escape") {
            if (overlay.visible) { e.preventDefault(); closeOverlay(); }
            return;
          }
          if (overlay.visible) return;
          if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
            e.preventDefault();
            goNext();
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            e.preventDefault();
            goPrev();
          } else if (e.key === "Home") {
            goTo(0);
          } else if (e.key === "End") {
            goTo(SLIDES.length - 1);
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [goNext, goPrev, goTo, overlay.visible, closeOverlay]);

      const touchStart = useRef(null);
      const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchStart.current === null) return;
        const dx = e.changedTouches[0].clientX - touchStart.current;
        if (Math.abs(dx) > 50) {
          if (dx < 0) goNext(); else goPrev();
        }
        touchStart.current = null;
      };

      const slide = SLIDES[current];

      return (
        <BrowserOverlayContext.Provider value={{ open: openOverlay }}>
        <div
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
          style={{
            position: "fixed",
            inset: 0,
            color: TEXT,
            fontFamily: FONT_STACK,
            overflow: "hidden",
          }}
        >
          <style>{`
            @keyframes pf-fadeIn    { from { opacity: 0 } to { opacity: 1 } }
            @keyframes pf-overlayIn { from { opacity: 0; transform: scale(0.97) } to { opacity: 1; transform: scale(1) } }
            @keyframes pf-imgIn     { from { opacity: 0; transform: scale(0.82) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
            @keyframes pf-imgOut    { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.88) translateY(8px); } }
            @keyframes pf-scrimIn   { from { opacity: 0; } to { opacity: 1; } }
            @keyframes pf-scrimOut  { from { opacity: 1; } to { opacity: 0; } }
            @keyframes pf-loopTravel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -832; } }
            .pf-fade-in  { animation: pf-fadeIn 220ms ease-out forwards; }
            .pf-fade-out { opacity: 0; transition: opacity 80ms ease-in; }
          `}</style>

          {/* Top branding bar */}
          <div style={{
            position: "fixed",
            top: 22, left: 26, right: 26,
            display: "flex",
            alignItems: "center",
            zIndex: 50,
            pointerEvents: "none",
          }}>
            <div style={{ pointerEvents: "auto" }}>
              <PFLockup height={32} />
            </div>
            <div style={{ flex: 1, height: 1, background: "rgba(255,255,255,0.18)", margin: "0 22px" }} />
            <span style={{
              fontSize: 11,
              fontWeight: 700,
              letterSpacing: 1.8,
              color: TEXT_DIM,
              fontFamily: FONT_STACK,
              marginRight: 12,
            }}>
              PROTOVIBING.AI
            </span>
            <div style={{ pointerEvents: "auto" }}>
              <FullscreenButton />
            </div>
          </div>

          {/* Slide stage */}
          <div
            key={slide.id}
            className={visible ? "pf-fade-in" : "pf-fade-out"}
            style={{
              position: "absolute",
              inset: 0,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
            }}
          >
            {slide.render()}
          </div>

          {/* Prev button */}
          {current !== 0 && (
            <button
              onClick={goPrev}
              aria-label="Previous slide"
              style={{
                position: "fixed",
                left: 16, bottom: 18,
                background: "rgba(255,255,255,0.04)",
                color: TEXT_MUTED,
                border: "1px solid rgba(255,255,255,0.1)",
                borderRadius: 999,
                width: 36, height: 36,
                fontSize: 18, cursor: "pointer",
                opacity: 0.75, zIndex: 50,
                fontFamily: FONT_STACK,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}
            >
              &#8592;
            </button>
          )}

          {/* Next button */}
          {current !== SLIDES.length - 1 && (
            <button
              onClick={goNext}
              aria-label="Next slide"
              style={{
                position: "fixed",
                right: 16, bottom: 18,
                background: "rgba(255,255,255,0.04)",
                color: TEXT_MUTED,
                border: "1px solid rgba(255,255,255,0.1)",
                borderRadius: 999,
                width: 36, height: 36,
                fontSize: 18, cursor: "pointer",
                opacity: 0.75, zIndex: 50,
                fontFamily: FONT_STACK,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}
            >
              &#8594;
            </button>
          )}

          {/* Slide indicator + notes hint */}
          <div style={{
            position: "fixed",
            bottom: 24,
            left: "50%",
            transform: "translateX(-50%)",
            color: TEXT_MUTED,
            fontSize: 13,
            letterSpacing: 1.5,
            fontWeight: 600,
            zIndex: 50,
            fontVariantNumeric: "tabular-nums",
            display: "flex",
            alignItems: "center",
            gap: 12,
          }}>
            <span>{current + 1} / {SLIDES.length}</span>
          </div>

        </div>

        {/* Browser fullscreen overlay */}
        <BrowserOverlay state={overlay} onClose={closeOverlay} />

        </BrowserOverlayContext.Provider>
      );
    }

    // =====================================================
    // MOBILE FALLBACK
    // =====================================================
    function useIsMobile() {
      const get = () => typeof window !== "undefined" && window.matchMedia("(max-width:767px)").matches;
      const [m, setM] = useState(get());
      useEffect(() => {
        const mq = window.matchMedia("(max-width:767px)");
        const handler = () => setM(mq.matches);
        mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
        return () => {
          mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
        };
      }, []);
      return m;
    }

    function MobileNotice() {
      return (
        <div style={{
          minHeight: "100vh",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          padding: "10vh 8vw",
          color: TEXT,
          fontFamily: FONT_STACK,
          textAlign: "center",
          gap: "1.5rem",
        }}>
          <PFLockup height={36} />
          <h1 style={{ fontSize: "1.6rem", color: TEXT, fontWeight: 700, margin: 0, lineHeight: 1.3 }}>
            Evolving Agentic Workflows
          </h1>
          <p style={{ color: TEXT_MUTED, fontSize: "1rem", lineHeight: 1.55, margin: 0 }}>
            This deck is designed for a laptop or large screen.
            Please open it on a wider display.
          </p>

          {/* Speaker card */}
          <div style={{
            marginTop: "1rem",
            paddingTop: "2rem",
            borderTop: `1px solid ${CARD_BORDER}`,
            width: "100%",
            maxWidth: 320,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: "0.85rem",
          }}>
            <img
              src="images/MKrejci - CircleAvatar - WhiteBorder.png"
              alt="Marc Krejci"
              style={{
                width: 96,
                height: 96,
                borderRadius: "50%",
                display: "block",
                boxShadow: `0 0 0 2px ${ACCENT_DIM}, 0 6px 20px rgba(0,0,0,0.35)`,
              }}
            />
            <div style={{
              fontSize: "1.15rem",
              color: TEXT,
              fontWeight: 700,
              letterSpacing: "-0.01em",
              lineHeight: 1.2,
            }}>
              Marc Krejci
            </div>
            <div style={{
              fontSize: "0.72rem",
              color: TEXT_MUTED,
              fontWeight: 500,
              letterSpacing: 1.5,
              textTransform: "uppercase",
            }}>
              Pathfinder Foundry
            </div>
            <a
              href="mailto:marc@pfndr.co"
              style={{
                fontSize: "0.95rem",
                color: ACCENT,
                fontFamily: MONO,
                letterSpacing: 0.3,
                textDecoration: "none",
                borderBottom: `1px solid ${ACCENT_DIM}`,
                paddingBottom: 1,
              }}
            >
              marc@pfndr.co
            </a>
          </div>
        </div>
      );
    }

    function App() {
      const mobile = useIsMobile();
      return mobile ? <MobileNotice /> : <Presentation />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
